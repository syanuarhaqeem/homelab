- name: Bootstrap ansible user
  hosts: all
  gather_facts: false
  become: true
  # Prompted values override inventory values, the bootstrap process will
  # connect as existing user from Debian installation until user 'ansible' exists.
  vars_prompt:
    - name: ansible_user
      prompt: User on serveraku
      private: false
    - name: ansible_become_password
      prompt: Enter password
      private: true
  tasks:
    # Ansible modules need Python.
    # python3-apt: required by the apt module in --check mode
    - name: Install Python for Ansible
      ansible.builtin.raw: |
        if [ -e /usr/bin/python3 ] && dpkg -s python3-apt >/dev/null 2>&1; then
          echo present
        else
          apt-get update && apt-get install -y python3 python3-apt && echo installed
        fi
      register: python_install
      changed_when: "'installed' in python_install.stdout"

    - name: Configure ansible user
      ansible.builtin.import_role:
        name: common
        tasks_from: ansible_user
