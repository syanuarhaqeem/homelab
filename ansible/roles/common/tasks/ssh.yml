- name: Configure SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-ansible.conf
    content: |
      # Managed by Ansible
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH
